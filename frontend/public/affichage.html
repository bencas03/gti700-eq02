<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Affichage capteurs</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <main>
      <h1>Affichage capteurs (son et ultrasonique)</h1>
      <p id="status" class="status ok">Connexion OK</p>

      <div class="columns">
        <section class="card">
          <h2>Son</h2>
          <p><strong>Valeur actuelle:</strong> <span id="sound-current">--</span></p>
          <p><strong>Moyenne (30):</strong> <span id="sound-avg">--</span></p>
          <canvas id="sound-chart"></canvas>
          <table>
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Valeur</th>
              </tr>
            </thead>
            <tbody id="sound-history"></tbody>
          </table>
        </section>

        <section class="card">
          <h2>Ultrasonique</h2>
          <p><strong>Valeur actuelle:</strong> <span id="ultrasonic-current">--</span></p>
          <p><strong>Moyenne (30):</strong> <span id="ultrasonic-avg">--</span></p>
          <canvas id="ultrasonic-chart"></canvas>
          <table>
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Valeur</th>
              </tr>
            </thead>
            <tbody id="ultrasonic-history"></tbody>
          </table>
        </section>
      </div>
    </main>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
